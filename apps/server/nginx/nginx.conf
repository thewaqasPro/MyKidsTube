worker_processes 1;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-Performance Buffer & Streaming Optimizations for 1GB VPS
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    output_buffers 2 64k;
    postpone_output 1460;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip settings for non-binary assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Cloudflare Real IP resolution
    map $http_cf_connecting_ip $real_client_ip {
        "" $remote_addr;
        default $http_cf_connecting_ip;
    }

    # --- HTTP Server (Port 80) ---
    server {
        listen 80 default_server;
        server_name kidsapi.waqas.pro localhost;
        client_max_body_size 500M;

        # 1. Video Streaming (HTTP 206 Partial Content / Range Requests)
        location /media/videos/ {
            alias /var/www/media/videos/;
            autoindex off;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges";
        }

        # 2. Thumbnails & Avatars
        location /media/thumbs/ {
            alias /var/www/media/thumbs/;
            autoindex off;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header Access-Control-Allow-Origin *;
        }

        # 3. Cloudflare Edge API Reverse Proxy (Transparent fallback for mobile apps)
        location /api/ {
            proxy_pass https://mykidstube.kidstube.workers.dev/api/;
            proxy_set_header Host mykidstube.kidstube.workers.dev;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Health Check & Root Redirect to Cloudflare Portal
        location = /health {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{"status":"ok","service":"MyKidsTube Media Storage Server","storage":"80GB SSD"}\n';
        }

        location / {
            # Browser navigation redirects to live Cloudflare Portal
            return 302 https://mykidstube.kidstube.workers.dev/;
        }
    }

    # --- HTTPS Server (Port 443) ---
    server {
        listen 443 ssl default_server;
        server_name kidsapi.waqas.pro localhost;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 500M;

        # 1. Video Streaming
        location /media/videos/ {
            alias /var/www/media/videos/;
            autoindex off;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges";
        }

        # 2. Thumbnails & Avatars
        location /media/thumbs/ {
            alias /var/www/media/thumbs/;
            autoindex off;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header Access-Control-Allow-Origin *;
        }

        # 3. Cloudflare Edge API Reverse Proxy
        location /api/ {
            proxy_pass https://mykidstube.kidstube.workers.dev/api/;
            proxy_set_header Host mykidstube.kidstube.workers.dev;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Health Check & Root Redirect to Cloudflare Portal
        location = /health {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{"status":"ok","service":"MyKidsTube Media Storage Server","storage":"80GB SSD"}\n';
        }

        location / {
            return 302 https://mykidstube.kidstube.workers.dev/;
        }
    }
}
