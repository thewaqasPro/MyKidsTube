worker_processes 1;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-Performance Buffer & Streaming Optimizations for 1GB VPS
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    output_buffers 2 64k;
    postpone_output 1460;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip settings for non-binary assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Cloudflare Real IP resolution
    map $http_cf_connecting_ip $real_client_ip {
        "" $remote_addr;
        default $http_cf_connecting_ip;
    }

    # Allowed Origins for Media CORS (Narrowed to portal and local app origins)
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" "$http_origin";
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
        "~^https://.*\.workers\.dev$" "$http_origin";
        "~^https://kidsapi\.waqas\.pro$" "$http_origin";
        "~^https://mykidstube\.pages\.dev$" "$http_origin";
    }

    # Rate Limiting & Connection Limiting Zones (Media files)
    limit_req_zone $real_client_ip zone=media_limit:10m rate=10r/s;
    limit_conn_zone $real_client_ip zone=media_conn:10m;
    limit_req_status 503;
    limit_conn_status 503;

    # Global Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- HTTP Server (Port 80) ---
    server {
        listen 80 default_server;
        server_name kidsapi.waqas.pro localhost;
        client_max_body_size 500M;

        # Health Check allowed over HTTP
        location = /health {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin $cors_origin;
            return 200 '{"status":"ok","service":"MyKidsTube Media Storage Server","storage":"80GB SSD"}\n';
        }

        # Blanket port-80 -> HTTPS redirect
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS Server (Port 443) ---
    server {
        listen 443 ssl default_server;
        server_name kidsapi.waqas.pro localhost;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 500M;

        # 1. Video Streaming (HTTP 206 Partial Content / Range Requests)
        location /media/videos/ {
            alias /var/www/media/videos/;
            autoindex off;

            # Rate Limiting & Concurrency: 10 req/s, burst 20, max 4 concurrent per IP
            limit_req zone=media_limit burst=20 nodelay;
            limit_conn media_conn 4;

            add_header Accept-Ranges bytes always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # CORS Preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Range, Authorization, Content-Type";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
            add_header Vary "Origin" always;
        }

        # 2. Thumbnails & Avatars
        location /media/thumbs/ {
            alias /var/www/media/thumbs/;
            autoindex off;

            limit_req zone=media_limit burst=30 nodelay;
            limit_conn media_conn 8;

            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # CORS Preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Range, Authorization, Content-Type";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Vary "Origin" always;
        }

        # 3. Media Storage Cleanup Microservice (Internal)
        location /api/storage/cleanup {
            proxy_pass http://cleaner:8081/cleanup;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            client_max_body_size 1M;
        }

        # 4. Cloudflare Edge API Reverse Proxy
        location /api/ {
            proxy_pass https://mykidstube.kidstube.workers.dev/api/;
            proxy_set_header Host mykidstube.kidstube.workers.dev;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Explicit proxy timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # 4. Health Check
        location = /health {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin $cors_origin;
            return 200 '{"status":"ok","service":"MyKidsTube Media Storage Server","storage":"80GB SSD"}\n';
        }

        location / {
            return 302 https://mykidstube.kidstube.workers.dev/;
        }
    }
}
