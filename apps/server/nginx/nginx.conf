worker_processes 1;

events {
    worker_connections 256;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Buffer optimizations for 1GB VPS memory footprint
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip settings for JSON and web assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Cloudflare Real IP resolution
    map $http_cf_connecting_ip $real_client_ip {
        "" $remote_addr;
        default $http_cf_connecting_ip;
    }

    # --- HTTP Server (Port 80) ---
    server {
        listen 80 default_server;
        server_name kidsapi.waqas.pro localhost;
        client_max_body_size 500M;

        # 1. Media Files (Videos) - Full HTTP 206 Partial Content
        location /media/videos/ {
            alias /var/www/media/videos/;
            autoindex off;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges";
        }

        # 2. Media Files (Thumbnails)
        location /media/thumbs/ {
            alias /var/www/media/thumbs/;
            autoindex off;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header Access-Control-Allow-Origin *;
        }

        # 3. API & Parent Web Dashboard
        location / {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }

    # --- HTTPS Server (Port 443) ---
    server {
        listen 443 ssl default_server;
        server_name kidsapi.waqas.pro localhost;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 500M;

        # 1. Media Files (Videos)
        location /media/videos/ {
            alias /var/www/media/videos/;
            autoindex off;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges";
        }

        # 2. Media Files (Thumbnails)
        location /media/thumbs/ {
            alias /var/www/media/thumbs/;
            autoindex off;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header Access-Control-Allow-Origin *;
        }

        # 3. API & Parent Web Dashboard
        location / {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
