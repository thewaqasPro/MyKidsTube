services:
  nginx:
    image: nginx:alpine
    container_name: safekids_nginx
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "${PORT_BINDING:-80}:80"
      - "${SSL_PORT_BINDING:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ${MEDIA_VIDEOS_DIR:-./data/media/videos}:/var/www/media/videos:ro
      - ${MEDIA_THUMBS_DIR:-./data/media/thumbs}:/var/www/media/thumbs:ro

