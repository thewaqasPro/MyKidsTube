services:
  nginx:
    image: nginx:alpine
    container_name: safekids_nginx
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PORT_BINDING:-80}:80"
      - "${SSL_PORT_BINDING:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /var/www/media/videos:/var/www/media/videos:ro
      - /var/www/media/thumbs:/var/www/media/thumbs:ro
