<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KidsTube - Parent & Media Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F0F0F;
      --surface: #222222;
      --card-bg: #272727;
      --border: #303030;
      --primary: #FF0000;
      --primary-hover: #D90000;
      --text: #F1F1F1;
      --text-muted: #AAAAAA;
      --success: #2BA640;
      --danger: #FF4E45;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 1. YOUTUBE HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 16px;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .brand-icon {
      width: 32px;
      height: 22px;
      background-color: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-icon svg {
      width: 14px;
      height: 14px;
      fill: #FFFFFF;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .brand-title span {
      font-size: 10px;
      background: #272727;
      color: var(--text-muted);
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 500;
      margin-left: 2px;
    }

    /* CENTERED SEARCH PILL */
    .search-container {
      flex: 1;
      max-width: 560px;
      display: flex;
      align-items: center;
    }
    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      background: #121212;
      border: 1px solid var(--border);
      border-radius: 40px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .search-box:focus-within {
      border-color: #3EA6FF;
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 8px 16px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .search-btn {
      background: var(--surface);
      border: none;
      border-left: 1px solid var(--border);
      padding: 8px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: color 0.2s;
    }
    .search-btn:hover {
      color: var(--text);
    }

    /* HEADER ACTIONS */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pill-btn {
      padding: 7px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .pill-btn:hover {
      background: #333333;
    }
    .pill-btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }
    .pill-btn-primary:hover {
      background: var(--primary-hover);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    /* 2. CATEGORY FILTER PILLS BAR */
    .chips-bar {
      position: sticky;
      top: 56px;
      z-index: 90;
      background: var(--bg);
      padding: 10px 16px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .chips-bar::-webkit-scrollbar {
      display: none;
    }
    .chip {
      padding: 6px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .chip:hover {
      background: #383838;
    }
    .chip.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 700;
    }

    /* 3. RESPONSIVE YOUTUBE GRID */
    main {
      flex: 1;
      padding: 20px 16px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }
    .video-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px 16px;
    }
    @media (min-width: 600px) {
      .video-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (min-width: 960px) {
      .video-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media (min-width: 1280px) {
      .video-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* YOUTUBE VIDEO CARD */
    .video-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      position: relative;
    }
    .thumb-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    .thumb-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .video-card:hover .thumb-container img {
      transform: scale(1.02);
    }
    .duration-tag {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.8);
      color: #FFFFFF;
      font-size: 11.5px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }
    .card-meta-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      align-items: flex-start;
    }
    .channel-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #E53935;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .card-details {
      flex: 1;
      overflow: hidden;
    }
    .card-title {
      font-size: 14.5px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .card-subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.3;
    }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .btn-delete:hover {
      color: var(--danger);
      background: rgba(255, 78, 69, 0.1);
    }

    /* MODAL DIALOGS */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      padding: 24px;
      position: relative;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 11px 14px;
      background: #181818;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--primary);
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #181818;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 13px;
      cursor: pointer;
    }
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    /* INLINE VIDEO PLAYER MODAL */
    .player-modal {
      max-width: 860px;
      width: 100%;
      padding: 16px;
    }
    .player-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .player-wrap video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- 1. YOUTUBE HEADER -->
  <header>
    <div class="brand-wrap" onclick="filterCategory('all')">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="brand-title">KidsTube <span>PARENT PORTAL</span></div>
    </div>

    <!-- Centered Search Pill -->
    <div class="search-container">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search fun videos..." oninput="handleSearch(this.value)">
        <button class="search-btn" title="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="header-actions">
      <button class="pill-btn pill-btn-primary" onclick="openModal('modal-ingest')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Add Video
      </button>
      <button id="seedShortsBtn" class="pill-btn" onclick="seedCuratedShorts()">
        <span>⚡</span> Seed 50 Shorts
      </button>
      <button class="pill-btn" onclick="openModal('modal-devices')">
        <span>📱</span> Pair Device
      </button>
      <div class="pill-btn" style="cursor: default;" title="Server Online">
        <div class="status-dot"></div>
        Online
      </div>
    </div>
  </header>

  <!-- 2. CATEGORY FILTER PILLS BAR -->
  <div class="chips-bar" id="categoryChips">
    <button class="chip active" onclick="filterCategory('all', this)">All</button>
    <button class="chip" onclick="filterCategory('shorts', this)">⚡ Shorts & Reels</button>
    <!-- Categories loaded dynamically -->
  </div>

  <!-- 3. MAIN YOUTUBE VIDEO GRID -->
  <main>
    <div class="video-grid" id="catalogContainer">
      <div class="empty-state">Loading library...</div>
    </div>
  </main>

  <!-- MODAL 1: ADD VIDEO / INGEST -->
  <div class="modal-overlay" id="modal-ingest">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">Download Video to Media Server</div>
        <button class="modal-close" onclick="closeModal('modal-ingest')">&times;</button>
      </div>
      <form id="ingestForm">
        <div>
          <label for="videoUrl">Video URL</label>
          <input type="url" id="videoUrl" placeholder="https://youtube.com/watch?v=... or TikTok/Vimeo" required />
        </div>
        <div>
          <label for="categorySelect">Shelf / Category</label>
          <select id="categorySelect"></select>
        </div>
        <div>
          <label for="qualitySelect">Quality Preset</label>
          <select id="qualitySelect">
            <option value="720p" selected>720p HD (Moderate - Recommended)</option>
            <option value="480p">480p SD (Compact - Saves 50% Space)</option>
          </select>
        </div>
        <div>
          <label>Allow for Children</label>
          <div id="profileCheckboxes" class="checkbox-group"></div>
        </div>
        <button type="submit" id="submitBtn" class="pill-btn pill-btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px;">
          Download to Server
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL 2: PAIR DEVICE -->
  <div class="modal-overlay" id="modal-devices">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">Pair a Phone or Tablet</div>
        <button class="modal-close" onclick="closeModal('modal-devices')">&times;</button>
      </div>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
        Open the KidsTube app on your child's phone or tablet to display the 6-digit pairing code.
      </p>
      <form id="pairForm">
        <div>
          <label for="pairingCodeInput">6-Digit Pairing Code</label>
          <input type="text" id="pairingCodeInput" placeholder="e.g. KID-482" style="font-family: monospace; font-size: 18px; letter-spacing: 2px;" required />
        </div>
        <div>
          <label for="pairProfileSelect">Assign to Child Profile</label>
          <select id="pairProfileSelect">
            <option value="">Shared Tablet (Shows Profile Selector)</option>
          </select>
        </div>
        <button type="submit" class="pill-btn pill-btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px;">
          Pair & Authorize Device
        </button>
      </form>
      <div style="margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px;">
        <div style="font-weight: 600; font-size: 14px; margin-bottom: 10px;">Paired Devices</div>
        <div id="deviceList"><div class="empty-state" style="padding: 12px 0;">Loading devices...</div></div>
      </div>
    </div>
  </div>

  <!-- MODAL 3: INLINE VIDEO PLAYER -->
  <div class="modal-overlay" id="modal-player" onclick="closePlayerOnBackdrop(event)">
    <div class="modal-box player-modal">
      <div class="modal-header" style="margin-bottom: 12px;">
        <div class="modal-title" id="playerTitle" style="font-size: 15px; font-weight: 500;">Playing Video</div>
        <button class="modal-close" onclick="closeModal('modal-player')">&times;</button>
      </div>
      <div class="player-wrap">
        <video id="playerVideo" controls autoplay></video>
      </div>
    </div>
  </div>

  <script>
    let allVideos = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let currentProfiles = [];

    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
      if (id === 'modal-devices') loadDevices();
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      if (id === 'modal-player') {
        const vid = document.getElementById('playerVideo');
        vid.pause();
        vid.src = '';
        const u = new URL(window.location);
        u.searchParams.delete('v');
        window.history.replaceState({}, '', u);
      }
    }

    function closePlayerOnBackdrop(e) {
      if (e.target.id === 'modal-player') closeModal('modal-player');
    }

    function playVideo(url, title, videoId) {
      document.getElementById('playerTitle').textContent = title;
      const vid = document.getElementById('playerVideo');
      vid.src = url;
      vid.load();
      vid.play().catch(() => {});
      openModal('modal-player');
      if (videoId) {
        const u = new URL(window.location);
        u.searchParams.set('v', videoId);
        window.history.replaceState({}, '', u);
      }
    }

    function filterCategory(catId, btnElement) {
      currentFilter = catId;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      if (btnElement) {
        btnElement.classList.add('active');
      }
      renderVideos();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      renderVideos();
    }

    function getChannelMeta(title) {
      if (title.includes('•')) {
        const parts = title.split('•');
        return { channel: parts[0].trim(), name: parts.slice(1).join('•').trim() };
      }
      return { channel: 'KidsTube', name: title };
    }

    function getAvatarColor(channel) {
      const colors = ['#E53935', '#1E88E5', '#43A047', '#FB8C00', '#8E24AA', '#00ACC1'];
      let hash = 0;
      for (let i = 0; i < channel.length; i++) hash += channel.charCodeAt(i);
      return colors[hash % colors.length];
    }

    function renderVideos() {
      const container = document.getElementById('catalogContainer');
      let filtered = allVideos;

      if (currentFilter !== 'all') {
        filtered = filtered.filter(v => v.category_id === currentFilter);
      }

      if (searchQuery) {
        filtered = filtered.filter(v => v.title.toLowerCase().includes(searchQuery));
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">No videos found.</div>';
        return;
      }

      container.innerHTML = filtered.map(v => {
        const meta = getChannelMeta(v.title);
        const avatarColor = getAvatarColor(meta.channel);
        const initial = meta.channel ? meta.channel[0].toUpperCase() : 'K';
        const mb = (v.file_size_bytes / (1024 * 1024)).toFixed(1);

        return `
          <div class="video-card">
            <div class="thumb-container" onclick="playVideo('${v.stream_url}', '${v.title.replace(/'/g, "\\'")}', '${v.id}')">
              <img src="${v.thumbnail_url}" alt="${v.title}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'160\\' height=\\'90\\'><rect fill=\\'%23222222\\' width=\\'160\\' height=\\'90\\'/></svg>'">
              <span class="duration-tag">${v.duration_formatted}</span>
            </div>
            <div class="card-meta-row" onclick="playVideo('${v.stream_url}', '${v.title.replace(/'/g, "\\'")}', '${v.id}')">
              <div class="channel-avatar" style="background: ${avatarColor};">${initial}</div>
              <div class="card-details">
                <div class="card-title" title="${v.title}">${meta.name}</div>
                <div class="card-subtitle">${meta.channel} • ${v.quality || '720p'} • ${mb} MB</div>
                <div class="card-actions">
                  <button class="btn-delete" onclick="event.stopPropagation(); deleteVideo('${v.id}')">Delete</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadCatalog() {
      try {
        const res = await fetch('/api/v1/catalog');
        const data = await res.json();
        allVideos = data.all_videos || [];
        renderVideos();

        // Check if single video URL parameter is present (?v=...)
        const urlParams = new URLSearchParams(window.location.search);
        const vidParam = urlParams.get('v');
        if (vidParam) {
          const target = allVideos.find(v => v.id === vidParam);
          if (target) {
            playVideo(target.stream_url, target.title, target.id);
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadCategories() {
      try {
        const res = await fetch('/api/v1/categories');
        const data = await res.json();
        
        // Select in Ingest Modal
        const select = document.getElementById('categorySelect');
        select.innerHTML = data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

        // Category Chips Bar
        const bar = document.getElementById('categoryChips');
        bar.innerHTML = `
          <button class="chip active" onclick="filterCategory('all', this)">All</button>
          <button class="chip" onclick="filterCategory('shorts', this)">⚡ Shorts & Reels</button>
          ${data.map(c => `<button class="chip" onclick="filterCategory('${c.id}', this)">${c.name}</button>`).join('')}
        `;
      } catch (e) {
        console.error(e);
      }
    }

    async function loadProfiles() {
      try {
        const res = await fetch('/api/v1/profiles');
        currentProfiles = await res.json();

        const checkWrap = document.getElementById('profileCheckboxes');
        checkWrap.innerHTML = currentProfiles.map(p => `
          <label class="checkbox-label">
            <input type="checkbox" name="profile_id" value="${p.id}" checked>
            <span>${p.name}</span>
          </label>
        `).join('');

        const pairSelect = document.getElementById('pairProfileSelect');
        pairSelect.innerHTML = '<option value="">Shared Tablet (Shows Profile Selector)</option>' +
          currentProfiles.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function loadDevices() {
      try {
        const res = await fetch('/api/v1/devices');
        const devices = await res.json();
        const list = document.getElementById('deviceList');
        if (devices.length === 0) {
          list.innerHTML = '<div class="empty-state" style="padding: 12px 0;">No devices paired yet.</div>';
          return;
        }
        list.innerHTML = devices.map(d => `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border);">
            <div>
              <div style="font-weight: 500; font-size: 14px;">${d.device_name}</div>
              <div style="font-size: 12px; color: var(--text-muted);">${d.profile_name || 'Shared Tablet'}</div>
            </div>
            <span style="font-size: 11px; color: var(--success); font-weight: 600;">PAIRED</span>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function seedCuratedShorts() {
      const btn = document.getElementById('seedShortsBtn');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> Seeding...';
      try {
        const res = await fetch('/api/v1/seed/shorts', { method: 'POST' });
        const data = await res.json();
        alert(data.message || '50 Curated Shorts seeded!');
        loadCatalog();
      } catch (e) {
        alert('Failed: ' + e);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>⚡</span> Seed 50 Shorts';
      }
    }

    async function deleteVideo(id) {
      if (!confirm('Are you sure you want to delete this video?')) return;
      await fetch(`/api/v1/videos/${id}`, { method: 'DELETE' });
      loadCatalog();
    }

    // Ingest Submit
    document.getElementById('ingestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('videoUrl').value.trim();
      const cat = document.getElementById('categorySelect').value;
      const qual = document.getElementById('qualitySelect').value;
      const checkedBoxes = Array.from(document.querySelectorAll('input[name="profile_id"]:checked')).map(cb => cb.value);

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Enqueuing...';

      try {
        const res = await fetch('/api/v1/ingest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: url,
            category_id: cat,
            quality: qual,
            allowed_profile_ids: checkedBoxes
          })
        });
        if (res.ok) {
          document.getElementById('videoUrl').value = '';
          closeModal('modal-ingest');
          alert('Video download task started!');
          loadCatalog();
        } else {
          const errData = await res.json().catch(() => ({}));
          alert(errData.detail || 'Failed to enqueue video');
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Download to Server';
      }
    });

    // Pair Submit
    document.getElementById('pairForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('pairingCodeInput').value.trim();
      const profile = document.getElementById('pairProfileSelect').value || null;

      const res = await fetch('/api/v1/devices/pair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pairing_code: code, profile_id: profile })
      });
      const data = await res.json();
      if (res.ok) {
        alert('Device successfully paired!');
        document.getElementById('pairingCodeInput').value = '';
        loadDevices();
      } else {
        alert('Pairing error: ' + (data.detail || 'Invalid code'));
      }
    });

    loadCategories();
    loadProfiles();
    loadCatalog();
    setInterval(loadCatalog, 15000);
  </script>
</body>
</html>
