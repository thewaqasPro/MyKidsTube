name: safe_tube
description: A dedicated, distraction-free kids video player with VPS sync and offline storage.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.2
  dio: ^5.7.0
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4
  sqflite: ^2.4.1
  path: ^1.9.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.16.1
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.3
  webview_flutter_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
